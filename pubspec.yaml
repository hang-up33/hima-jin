name: hima_jin
description: ヒマジン — 暇人実績解除ゲーム
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.3

  # Local persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & animation
  flutter_animate: ^4.5.2
  confetti: ^0.8.0

  # Utilities
  share_plus: ^10.0.3
  uuid: ^4.5.1
  flutter_local_notifications: ^18.0.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
